name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - 'deployment-retry.txt'
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '45.67.57.126 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF9syvOxYYoiYUkB98hK9B3age8ziwla5QZR/IYBGqWI' >> ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          VPS_HOST: 45.67.57.126
        run: |
          release="/opt/mindresearch/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "deploy@$VPS_HOST")
          "${remote[@]}" "mkdir '$release'"
          tar -czf - package.json package-lock.json apps/api/package.json apps/web/package.json apps/api/dist apps/web/dist deploy/release.sh |
            "${remote[@]}" "tar -xzf - -C '$release'"
          "${remote[@]}" "bash '$release/deploy/release.sh' '$release'"
